# Automatic tag and GitHub release, driven by the version in DESCRIPTION.
#
# Ported from nemeton, with one deliberate change. There, the release workflow
# fires on `push` to main independently of the checks, so a commit that bumps
# the version and breaks the build still publishes a release. Here it fires on
# `workflow_run`: it only starts once R-CMD-check has completed, and it stops
# unless that run succeeded. A release should never be the first thing anyone
# learns about a red build.
#
# What it does, when R-CMD-check goes green on main:
#   1. reads `Version:` from DESCRIPTION;
#   2. proceeds only for a STABLE X.Y.Z — a development cycle X.Y.Z.9000 is
#      ignored, so day-to-day work never tags;
#   3. proceeds only if the tag vX.Y.Z does not already exist, so re-pushing
#      main without a bump does nothing;
#   4. creates the annotated tag and the GitHub release, taking the notes from
#      the matching NEWS.md section when there is one.
#
# The version-consistency job in R-CMD-check has already established that
# DESCRIPTION, NEWS.md and CITATION.cff agree before this point.

name: release

on:
  workflow_run:
    workflows: ["R-CMD-check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A failed or cancelled check must not publish anything. workflow_dispatch
    # carries no upstream conclusion, hence the second clause.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # workflow_run checks out the default branch by default; pin it to
          # the commit that was actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Read the version from DESCRIPTION
        id: ver
        run: |
          version="$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version read: ${version}"

      - name: Gate — stable X.Y.Z only
        id: gate
        run: |
          v="${{ steps.ver.outputs.version }}"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Development version ($v) — nothing to release."
          fi

      - name: Gate — tag must not already exist
        id: tag
        if: steps.gate.outputs.release == 'true'
        run: |
          git fetch --tags --quiet
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already present — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's NEWS.md section
        id: notes
        if: steps.gate.outputs.release == 'true' && steps.tag.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          # Everything between this version's heading and the next one. Falls
          # back to generated notes when the section is missing, rather than
          # publishing an empty release body.
          awk -v ver="$v" '
            $0 ~ "^# firexpovulnR " ver "([^0-9]|$)" {flag=1; next}
            flag && /^# firexpovulnR / {exit}
            flag {print}
          ' NEWS.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "No NEWS.md section for $v — falling back to generated notes."
          fi

      - name: Create the annotated tag and the release
        if: steps.gate.outputs.release == 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Release ${{ steps.ver.outputs.version }}"
          git push origin "$v"
          if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$v" --title "$v" --notes-file release-notes.md
          else
            gh release create "$v" --title "$v" --generate-notes
          fi
          echo "Release $v created."
