# Documentation site, built by pkgdown and published to GitHub Pages.
#
# Derived from https://github.com/r-lib/actions/tree/v2/examples, following the
# same shape as nemeton's.
#
# The vignette is built here as well as in R-CMD-check. It runs on synthetic
# data and takes about eight seconds, so there is no reason to skip it in
# either place -- and skipping it in one of them is exactly what turned the
# first phase 7 push red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FIREXPOVULNR_TEST_NETWORK: "0"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # See the R-CMD-check workflow: lidR is on r-lidar's r-universe.
          extra-repositories: 'https://r-lidar.r-universe.dev'

      - name: Install system dependencies
        # The font and image libraries on top of the geospatial stack are what
        # ragg and the site's figures need.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        # Publish only from main or a published release. A pull request and a
        # manual dispatch build the site without deploying it, so a branch can
        # be validated without overwriting what is live.
        if: github.event_name == 'push' || github.event_name == 'release'
        # v4.9.0 runs on node24. v4.5.0 declared node20, which the runners now
        # force onto node24 anyway while warning about it -- so this only makes
        # explicit what was already happening. The three inputs below are
        # unchanged in the interval.
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          # clean: true prunes what the site no longer contains. With `false`
          # the deploy only ever added and overwrote, so a function removed from
          # the package kept its reference page live -- fev_fetch_clcplus.html
          # was still served with HTTP 200 after the function was deleted, which
          # is worse than a 404: a reader arriving from a search engine reads
          # documentation for something that no longer exists.
          #
          # Safe here because gh-pages holds the pkgdown site and nothing else:
          # every file on it, lightswitch.js and llms.txt included, is generated
          # into docs/ by build_site_github_pages(). Verified 2026-08-18.
          clean: true
          branch: gh-pages
          folder: docs
