# Coverage is information, not a gate: a build must go red for a regression in
# the code, never because a report moved a percent. `informational` keeps the
# Codecov check green while still posting the delta on a pull request.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  - "tests/**"
  - "data-raw/**"
